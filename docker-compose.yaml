version: "3.5"

services:
  backend:
    container_name: ${APP_NAME}-backend
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        user: is
        uid: 1000
    ports:
      - 38300:8080
    volumes:
      - ./:/app
    networks:
      - ${APP_NAME}-network
networks:
  go-gin-network:
    name: ${APP_NAME}-network